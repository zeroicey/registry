# Registry — personnel registration system: API + built SPA in one image.
# Deploy conventions follow serenique on hpcore (see ~/serenique-deploy/):
#   - project dir + .env (secrets live in .env)
#   - restart: unless-stopped
#   - services bound to 127.0.0.1 + 10.126.126.2 (LAN)
#   - image distributed via docker save/load (no registry pull)
#
# Ports: host 3100 -> container 3000 (3000/3001/3002 are taken on hpcore).
# The SPA is served by the API itself (Hono serveStatic + index.html
# fallback) — no nginx / static server needed.

services:
  api:
    image: zeroicey/registry-api:latest
    container_name: registry-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
      - "10.126.126.2:3100:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
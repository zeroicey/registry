# Registry — personnel registration system: API + built SPA in one image.
# Deploy conventions follow serenique on hpcore (see ~/serenique-deploy/):
#   - project dir + .env (secrets live in .env)
#   - restart: unless-stopped
#   - LAN binding via ${LAN_IP} (set in .env, not committed)
#   - image pulled from ghcr.io (GitHub Actions builds it on every push)
#
# Ports: host 3100 -> container 3000 (3000/3001/3002 are taken on hpcore).
# The SPA is served by the API itself (Hono serveStatic + index.html
# fallback) — no nginx / static server needed.

services:
  api:
    image: ghcr.io/zeroicey/registry-api:latest
    container_name: registry-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      UPLOAD_ROOT: /app/storage/files
    volumes:
      - ./storage/files:/app/storage/files
    ports:
      - "127.0.0.1:3100:3000"
      - "${LAN_IP}:3100:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
